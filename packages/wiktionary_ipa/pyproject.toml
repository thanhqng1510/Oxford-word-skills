[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wiktionary-ipa"
version = "1.0.0"
description = "Fast, automated British English (RP) IPA extractor and verifier querying en.wiktionary.org live."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Oxford Word Skills Contributors" }
]
keywords = ["ipa", "wiktionary", "phonetics", "british-english", "received-pronunciation", "linguistics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
wiktionary-ipa = "wiktionary_ipa.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wiktionary_ipa*"]
